services:
  # ── FastAPI Primary Backend ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: talentbench-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=talentbench
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentbench-net

  # ── Celery Worker: Resume Screening (High Concurrency) ────────────────────
  worker-resume:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: talentbench-worker-resume
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "resume_queue", "-c", "8", "-n", "resume_worker@%h"]
    environment:
      - ENVIRONMENT=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=talentbench
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentbench-net

  # ── Celery Worker: Scoring & Evaluation ───────────────────────────────────
  worker-scoring:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: talentbench-worker-scoring
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "scoring_queue,benchmark_queue", "-c", "4", "-n", "scoring_worker@%h"]
    environment:
      - ENVIRONMENT=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=talentbench
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentbench-net

  # ── Celery Worker: Mail Dispatch & DLQ ───────────────────────────────────
  worker-mail:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: talentbench-worker-mail
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "mail_queue,dlq_queue", "-c", "16", "-n", "mail_worker@%h"]
    environment:
      - ENVIRONMENT=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=talentbench
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentbench-net

  # ── PostgreSQL 16 with pgvector ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentbench-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=talentbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentbench"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talentbench-net

  # ── Redis 7 (Cache, PubSub, Celery Broker) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: talentbench-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talentbench-net

  # ── MinIO (S3-Compatible Object Storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: talentbench-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - talentbench-net

  # ── Flower (Celery Task Monitoring) ───────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: talentbench-flower
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - talentbench-net

  # ── Prometheus (Metrics Scraping) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: talentbench-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - talentbench-net

  # ── Grafana (Dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: talentbench-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - talentbench-net

networks:
  talentbench-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:


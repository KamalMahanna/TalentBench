[project]
name = "talentbench-backend"
version = "0.1.0"
description = "Production backend for TalentBench recruiter platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "celery[redis]>=5.3.6",
    "flower>=2.0.1",
    "redis[hiredis]>=5.0.3",
    "sse-starlette>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "aioboto3>=12.3.0",
    "boto3>=1.34.69",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "httpx>=0.27.0",
    "faker>=24.2.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1.post1",
    "langchain-groq>=1.1.0",
    "groq>=0.37.0",
    "langchain-openai>=1.6.0",
    "openai>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
